services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - db:/var/lib/postgresql:Z
    env_file:
      - db.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s 

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  app:
    image: nextcloud:34-frm-alpine
    restart: unless-stopped

  

