services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - db:/var/lib/postgresql/data:z
    env_file:
      - db.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s 

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s 
      retries: 5

  app:
    image: nextcloud:34-fpm-alpine
    restart: unless-stopped
    volumes:
      - nextcloud:/var/www/html:z
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - db.env
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
  cron:
    image: nextcloud:34-fpm-alpine
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
    - nextcloud:/var/www/html:z
    entrypoint: /cron.sh 
  web:
    image: nginx:alpine-slim
    restart: unless-stopped
    ports:
      - 127.0.0.1:8080:80
    volumes:
      - ./web/nginx.conf:/etc/nginx/nginx.conf:ro
      - nextcloud:/var/www/html:z,ro
    depends_on:
      - app

volumes:
  db:
  nextcloud:


      

  

